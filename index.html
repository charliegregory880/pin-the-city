<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pin the City">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pin the City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
/* Night flight: a globe floating in space, an airport split-flap board top-left, controls docked bottom-centre.
   Deliberately one dark visual world, so colours are set once on :root. */
:root{
  --night:#07101d; --space:#0c1a2e; --ocean:#0e2238; --ocean-hi:#1c3d60;
  --land-0:#34556a; --land-1:#3b5e71; --land-2:#2f4d62; --land-3:#416476; --land-4:#38596c;
  --land-edge:#7ea2b3; --coast:#9fe3d8; --grat:#244563;
  --ink:#e9eff5; --muted:#8fa4b8; --line:#253a52; --panel:rgba(9,19,33,.82);
  --amber:#ffb23f; --amber-dim:#9c7438; --on-amber:#201505; --teal:#4fe0c6;
  --tile:#17243a; --tile-lo:#111c2e; --seam:#03070d;
  --c-bull:#4fe0c6; --c-great:#86b8ff; --c-good:#cfa8ff; --c-off:#ff8f80;
  --paper:#dde9e3; --paper-ink:#1b3245; --bull:#0d7560; --great:#1f4b88; --good:#6c3fa3; --off:#ad3329;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;touch-action:manipulation} /* no double-tap zoom; the globe handles its own pinch */
body{background:radial-gradient(ellipse at 55% 45%,var(--space),var(--night) 72%) var(--night);color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

#stage,#stars,#earth,#globe,#fx{position:fixed;inset:0;width:100%;height:100%}
#globe{display:block;touch-action:none;cursor:grab}
#globe.aim{cursor:crosshair}
#globe.grabbing{cursor:grabbing}
#fx{pointer-events:none;z-index:12}
#stage.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}

.arc-glow{fill:none;stroke:var(--amber);stroke-opacity:.18;stroke-width:9;stroke-linecap:round}
.arc{fill:none;stroke:var(--amber);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1 6}
.pin .shadow{fill:#000}
.pin .body path{stroke:var(--night);stroke-width:1.5}
.pin .dot{fill:var(--night)}
.pin.guess .body path{fill:var(--amber)}
.pin.answer .body path{fill:var(--teal)}
.pin .halo{fill:none;stroke:var(--teal);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
.pin.guess .halo{display:none}
@keyframes halo{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.plane path{fill:var(--ink);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}

/* Departure board */
.board{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:min(400px,calc(100% - 32px));box-sizing:border-box;padding:16px 16px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.board-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:.85rem}
.total{font:800 1.7rem/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.total small{font:600 .75rem var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}
.tier{margin:12px 0 8px;font-size:.85rem;color:var(--amber);display:flex;align-items:center;gap:8px}
.tier::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.flaps{display:flex;flex-wrap:wrap;gap:.16em .42em;font-size:var(--fs,40px);min-height:1.18em}
.word{display:flex;gap:.06em}
.flap{display:inline-grid;place-items:center;width:.8em;height:1.18em;border-radius:.09em;
  background:linear-gradient(var(--tile) 0 49.4%,var(--seam) 49.4% 50.6%,var(--tile-lo) 50.6%);
  color:var(--amber-dim);font:800 1em/1 var(--display);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.flap.tick{animation:tick 60ms linear}
.flap.set{color:var(--amber);text-shadow:0 0 14px rgba(255,178,63,.45)}
@keyframes tick{50%{transform:scaleY(.55)}}
.legs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 0;padding:0;list-style:none}
.legs li{height:6px;border-radius:3px;background:var(--line);transition:background .4s}
.legs li.now{background:var(--amber);animation:pulse 1.4s ease-in-out infinite}
.legs li[class^="t-"]{background:currentColor}
@keyframes pulse{50%{opacity:.35}}
.country{margin:8px 0 0;font-size:.95rem;font-weight:600;color:var(--teal);min-height:1.2em}
.country.in{animation:rise .5s ease-out both}
.best{margin:8px 0 0;font-size:.78rem;color:var(--muted);min-height:1em}

.t-bull{color:var(--c-bull)} .t-great{color:var(--c-great)} .t-good{color:var(--c-good)} .t-off{color:var(--c-off)}

/* Dock */
.dock{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:min(420px,calc(100% - 32px));display:grid;gap:10px;justify-items:center;text-align:center}
.pop{position:absolute;bottom:100%;margin-bottom:14px;left:50%;transform:translateX(-50%)}
.readout{min-height:2.4rem;display:flex;gap:16px;align-items:baseline;justify-content:center;font:800 2.1rem/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.readout small{font:600 .85rem var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}
.readout .pts{color:var(--amber);animation:rise .4s ease-out both}
.go{width:100%;padding:14px 20px;border:0;border-radius:999px;background:var(--amber);color:var(--on-amber);font:600 1.05rem var(--body);cursor:pointer;
  box-shadow:0 10px 34px -10px rgba(255,178,63,.75);transition:transform .15s,box-shadow .15s}
@media (hover:hover){.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 40px -10px rgba(255,178,63,.9)}} /* no sticky hover after a tap */
.go:active:not(:disabled){transform:scale(.98)}
.go:disabled{background:#223247;color:var(--muted);box-shadow:none;cursor:not-allowed}
.go:focus-visible,.zoom button:focus-visible,.pp-actions button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.hint{margin:0;font-size:.8rem;color:var(--muted);min-height:1.2em}

.zoom{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:8px}
.zoom button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 1.3rem/1 var(--body);cursor:pointer}

/* Stamps (mid-game pop and passport) */
.stamp{--r:0deg;--o:1;width:128px;box-sizing:border-box;padding:10px 8px;display:grid;gap:3px;justify-items:center;align-content:center;text-align:center;
  border:2.5px solid currentColor;border-radius:10px;box-shadow:inset 0 0 0 3px var(--stamp-bg),inset 0 0 0 4.5px currentColor;background:var(--stamp-bg);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;transform:rotate(var(--r));opacity:var(--o);filter:url(#rough);
  animation:thunk .5s cubic-bezier(.2,1.5,.35,1) var(--d,0s) both}
.stamp.t-bull{border-radius:50%;width:132px;aspect-ratio:1}
.stamp strong{font-size:1.3rem;line-height:1;font-weight:800;text-wrap:balance}
.stamp small{font-size:.78rem;font-weight:700}
.pop .stamp{--stamp-bg:rgba(7,16,29,.82)}
@keyframes thunk{from{opacity:0;transform:scale(2.4) rotate(calc(var(--r) - 16deg))}60%{opacity:1}to{opacity:var(--o);transform:scale(1) rotate(var(--r))}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* Final: passport flight log */
.final{position:fixed;inset:0;z-index:10;overflow:auto;background:rgba(3,8,15,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.passport{margin:auto;width:min(780px,100%);box-sizing:border-box;padding:clamp(18px,4vw,34px);border-radius:16px;color:var(--paper-ink);display:grid;gap:20px;
  background:repeating-radial-gradient(circle at 0 0,transparent 0 13px,rgba(27,50,69,.05) 13px 14px),repeating-radial-gradient(circle at 100% 100%,transparent 0 17px,rgba(13,117,96,.05) 17px 18px),var(--paper);
  box-shadow:0 40px 90px -24px #000;animation:open .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes open{from{opacity:0;transform:translateY(40px) rotateX(18deg) scale(.96)}}
.pp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.pp-head p{margin:0}
.pp-label{font-size:.85rem;font-weight:600;opacity:.75}
.pp-total{font:800 clamp(3.6rem,13vw,6.2rem)/.85 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pp-of{font-size:.9rem;opacity:.7;margin-top:4px!important}
.pp-rank{font:800 clamp(1.6rem,5vw,2.3rem)/1 var(--display);text-align:right}
.pp-best{font-size:.85rem;text-align:right;margin-top:6px!important;opacity:.8}
.pp-best.pb{opacity:1;color:var(--bull);font-weight:600}
.routes{width:100%;height:auto;display:block;border-radius:10px;background:rgba(27,50,69,.06)}
.r-sphere{fill:rgba(27,50,69,.04);stroke:rgba(27,50,69,.18)}
.r-land{fill:rgba(27,50,69,.16)}
.r-arc{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.r-guess{fill:var(--paper);stroke:currentColor;stroke-width:2}
.r-target{fill:currentColor}
.routes text{fill:currentColor;font:800 15px var(--display)}
.stamps{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px}
.passport .stamp{--stamp-bg:var(--paper);--o:.9;mix-blend-mode:multiply}
.passport .t-bull{color:var(--bull)} .passport .t-great{color:var(--great)} .passport .t-good{color:var(--good)} .passport .t-off{color:var(--off)}
.mrz{margin:0;font:600 clamp(.58rem,2.1vw,.92rem)/1.5 var(--mono);letter-spacing:.12em;opacity:.55;overflow-x:auto;white-space:pre;border-top:1px dashed rgba(27,50,69,.3);padding-top:12px}
.pp-actions{display:flex;flex-wrap:wrap;gap:10px}
.pp-actions button{flex:1 1 180px;padding:13px 18px;border-radius:999px;font:600 1rem var(--body);cursor:pointer}
#again{border:0;background:var(--paper-ink);color:var(--paper)}
#copy{border:2px solid var(--paper-ink);background:transparent;color:var(--paper-ink)}
.pp-credit{margin:0;font-size:.75rem;opacity:.6}
#shareText{margin:0;padding:10px;border-radius:8px;background:rgba(27,50,69,.08);font:500 .9rem/1.5 var(--mono);white-space:pre-wrap;-webkit-user-select:all;user-select:all}

@media (max-width:899px){ .zoom{top:auto;transform:none;bottom:calc(150px + env(safe-area-inset-bottom,0px))} }

/* Touch screens: pinch replaces the zoom buttons, and the effects iOS Safari finds expensive are swapped for cheap ones */
@media (pointer:coarse){
  .zoom{display:none}
  .board{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(9,19,33,.93)}
  .final{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(3,8,15,.9)}
  .stamp{filter:none}
}
/* Phones in portrait: a tighter board so the globe gets the space */
@media (max-width:600px){
  .board{top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:calc(100% - 24px);padding:12px 12px 10px;border-radius:12px}
  .total{font-size:1.5rem}
  .tier{margin:8px 0 6px}
  .country{margin-top:6px}
  .legs{margin-top:10px;gap:5px}
  .legs li{height:5px}
  .best{display:none}
  .dock{bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);gap:8px}
  .readout{font-size:1.8rem;min-height:2.1rem}
  .go{padding:14px 20px;font-size:1.05rem}
  .hint{font-size:.75rem}
  .pop{scale:.85;margin-bottom:8px}
  .stamps{gap:10px 8px}
  .stamp{width:116px}
  .stamp.t-bull{width:120px}
}
/* Phones in landscape: board on the left, globe on the right */
@media (max-height:520px) and (orientation:landscape){
  .board{width:min(300px,40%);top:calc(10px + env(safe-area-inset-top,0px));padding:10px 12px}
  .best,.hint{display:none}
  .readout{font-size:1.6rem;min-height:1.9rem}
  .go{padding:11px 18px}
  .dock{width:min(320px,45%);bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:6px}
  .pop{scale:.75;margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
</svg>

<div id="stage"><canvas id="stars"></canvas><canvas id="earth"></canvas><svg id="globe" aria-label="Globe. Drag to spin, click to drop your pin."></svg></div>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="board" id="board">
  <div class="board-top"><span id="round">Preparing for departure</span><span class="total"><span id="total">0</span><small>pts</small></span></div>
  <p class="tier" id="tier">Loading the globe</p>
  <h1 class="sr-only" id="cityName"></h1>
  <div class="flaps" id="flaps" aria-hidden="true"></div>
  <p class="country" id="country" aria-hidden="true"></p>
  <ol class="legs" id="legs"><li></li><li></li><li></li><li></li><li></li></ol>
  <p class="best" id="best"></p>
</header>

<div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button></div>

<div class="dock" id="dock">
  <div class="pop" id="pop" hidden></div>
  <div class="readout" id="readout" aria-live="polite"></div>
  <button class="go" id="go" type="button" disabled>Lock in guess</button>
  <p class="hint" id="hint"></p>
</div>

<section class="final" id="final" hidden aria-labelledby="fTitle">
  <div class="passport">
    <div class="pp-head">
      <div>
        <p class="pp-label" id="fTitle">Flight log</p>
        <p class="pp-total" id="fTotal">0</p>
        <p class="pp-of">of 25,000 points</p>
      </div>
      <div>
        <p class="pp-rank" id="fRank"></p>
        <p class="pp-best" id="fBest"></p>
      </div>
    </div>
    <svg class="routes" id="routes" viewBox="0 0 960 480" role="img" aria-label="Your five guesses and the real cities"></svg>
    <div class="stamps" id="stamps"></div>
    <p class="mrz" id="mrz" aria-hidden="true"></p>
    <div class="pp-actions">
      <button id="again" type="button">Fly again</button>
      <button id="copy" type="button">Copy result</button>
    </div>
    <pre id="shareText" hidden></pre>
    <p class="pp-credit">City data from GeoNames (CC BY 4.0). Map outlines from Natural Earth.</p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
// ---------- Game data ----------
let TIERS = []; // five tiers of [name, country, lat, lng], loaded from cities.json
const SCALE_KM = 1500;   // higher = more forgiving; 5000 * e^(-km / SCALE_KM)
const ROUNDS = 5, MAX = 5000 * ROUNDS;
const RECENT_LIMIT = 60; // cities to avoid repeating across games
const GRADES = [         // ~125 km, ~410 km, ~1,040 km
  {min: 4600, key: "bull",  label: "Bullseye",    emoji: "🎯"},
  {min: 3800, key: "great", label: "Great guess", emoji: "🟩"},
  {min: 2500, key: "good",  label: "Not bad",     emoji: "🟨"},
  {min: 0,    key: "off",   label: "Way off",     emoji: "🟥"},
];
const RANKS = [[21000, "Cartographer"], [16000, "Navigator"], [10000, "Frequent flyer"], [5000, "Tourist"], [0, "Lost luggage"]];
const grade = pts => GRADES.find(g => pts >= g.min);

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = n => Math.round(n).toLocaleString("en-GB");
const rand = (a, b) => a + Math.random() * (b - a);
const store = { // localStorage can be blocked, so never let it break the game
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let recent = store.get("pin-recent", []), best = store.get("pin-best", 0);

function countTo(el, from, to, dur = 800) {
  if (reduced) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  (function tick(now) {
    const t = Math.min(1, (now - t0) / dur);
    el.textContent = fmt(from + (to - from) * d3.easeCubicOut(t));
    if (t < 1) requestAnimationFrame(tick);
  })(t0);
}

// ---------- Globe setup ----------
const svg = d3.select("#globe"), node = svg.node();
const arcGlow = svg.append("path").attr("class", "arc-glow");
const arcP   = svg.append("path").attr("class", "arc");
const PIN = "M0,0 C-2,-6 -9,-10 -9,-17 a9,9 0 1,1 18,0 C9,-10 2,-6 0,0Z";
const PLANE = "M0,-9 L2,-3 L9,1 L9,3 L2,1 L1.5,6 L4,8 L4,9.5 L0,8.5 L-4,9.5 L-4,8 L-1.5,6 L-2,1 L-9,3 L-9,1 L-2,-3Z";
function buildPin(cls) {
  const g = svg.append("g").attr("class", `pin ${cls}`).attr("display", "none");
  g.append("ellipse").attr("class", "shadow").attr("rx", 6).attr("ry", 2.2);
  g.append("circle").attr("class", "halo").attr("r", 10);
  const body = g.append("g").attr("class", "body");
  body.append("path").attr("d", PIN);
  body.append("circle").attr("class", "dot").attr("cy", -17).attr("r", 3.6);
  return g;
}
const guessPin = buildPin("guess"), answerPin = buildPin("answer");
const plane = svg.append("g").attr("class", "plane").attr("display", "none");
plane.append("path").attr("d", PLANE);

const projection = d3.geoOrthographic().clipAngle(90).precision(0).rotate([-10, -20, 0]);
const path = d3.geoPath(projection);
let W, H, dpr, edpr, cx, cy, base, availW, availH, zf = 1, zGoal = 1; // zf eases towards zGoal each frame
const clampZ = z => Math.max(.85, Math.min(14, z));

// ---------- Animation loop ----------
// Every animation is a step function in `anims`; the globe only redraws when something marked it dirty.
const anims = new Set();
const coarse = matchMedia("(pointer: coarse)").matches; // a touch screen
let lite = false, slow = 0;
let dirty = true, last = performance.now(), spinning = false;
function animate(dur, step = () => {}, ease = d3.easeCubicInOut) {
  return new Promise(res => {
    if (reduced || !dur) { step(1); dirty = true; res(); return; }
    const t0 = performance.now();
    anims.add(now => {
      const t = Math.min(1, (now - t0) / dur);
      step(ease(t)); dirty = true;
      if (t >= 1) { res(); return false; }
      return true;
    });
  });
}
function frame(now) {
  const dt = Math.min(64, now - last); last = now;
  for (const a of [...anims]) if (!a(now)) anims.delete(a);
  if (spinning && !reduced) { const r = projection.rotate(); projection.rotate([r[0] + dt * .006, r[1], r[2]]); dirty = true; }
  if (!busy && Math.abs(zGoal - zf) > 1e-4) { // smooth zoom: close ~15% of the gap per frame, whatever the frame rate
    zf += (zGoal - zf) * (reduced ? 1 : 1 - Math.exp(-dt / 110)); dirty = true;
  }
  if (dirty) {
    const t0 = performance.now(); render(now); dirty = false;
    // A device that keeps taking >12 ms per frame switches, once, to a lighter mode
    if (!lite) { slow = performance.now() - t0 > 12 ? slow + 1 : Math.max(0, slow - 1); if (slow > 20) { lite = true; layout(true); } }
  }
  stepFx(dt);
  requestAnimationFrame(frame);
}

function flyTo(rot, zoom, dur) {
  const r0 = projection.rotate(), z0 = zf;
  zGoal = zoom;

let round = 0, total = 0, target, guess, guessAt = 0, targetAt = 0, targetShown = false;
let phase = "loading", flight = null, busy = false, results = [], cityName = "", cityCountry = "";

function pick(cities) { // prefer cities not seen recently
  const key = c => `${c[0]}|${c[1]}`;
  const fresh = cities.filter(c => !recent.includes(key(c)));
  const pool = fresh.length ? fresh : cities;
  const city = pool[Math.floor(Math.random() * pool.length)];
  recent = [key(city), ...recent].slice(0, RECENT_LIMIT);

function updateLegs() {
  [...$("legs").children].forEach((li, i) => {

  });
}

}

  $("pop").hidden = true; $("readout").textContent = "";

  $("tier").textContent = t.name;
  $("cityName").textContent = name;
  $("country").textContent = ""; $("country").classList.remove("in");
  $("best").textContent = best ? `Personal best ${fmt(best)}` : "";

// ---------- Input: drag to spin, pinch or wheel to zoom, tap to pin ----------
const pointers = new Map(); let gesture = null;
const pinchDist = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
node.addEventListener("pointerdown", e => {
  node.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); spinning = false;
  gesture = pointers.size === 1 ? {type: "drag", x: e.clientX, y: e.clientY, rot: projection.rotate(), moved: false}
                                : {type: "pinch", d: pinchDist(), z: zf};
});
node.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (!gesture || busy) return;
  if (gesture.type === "drag") {
    const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
    if (!gesture.moved && Math.hypot(dx, dy) < (e.pointerType === "touch" ? 9 : 5)) return; // fingers wobble more than mice
    gesture.moved = true; node.classList.add("grabbing");
    const k = 60 / projection.scale();
    projection.rotate([gesture.rot[0] + dx * k, Math.max(-80, Math.min(80, gesture.rot[1] - dy * k)), 0]); dirty = true;
  } else if (gesture.type === "pinch" && pointers.size === 2) { zf = zGoal = clampZ(gesture.z * pinchDist() / gesture.d); dirty = true; }
});
function endPointer(e) {
  const g = gesture; pointers.delete(e.pointerId); node.classList.remove("grabbing");
  if (g && g.type === "drag" && !g.moved && e.type === "pointerup" && !busy) dropPin(e);
  gesture = pointers.size ? {type: "done"} : null; // lifting one finger of a pinch shouldn't drop a pin
}
node.addEventListener("pointerup", endPointer);
node.addEventListener("pointercancel", endPointer);
node.addEventListener("wheel", e => {
  e.preventDefault(); if (busy) return;
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : 1); // some mice report lines, not pixels
  spinning = false; zGoal = clampZ(zGoal * Math.exp(-dy * .002));
}, {passive: false});
const zoomBy = f => { if (busy) return; spinning = false; zGoal = clampZ(zGoal * f); };
$("zin").onclick = () => zoomBy(1.6);
$("zout").onclick = () => zoomBy(1 / 1.6);

// Stop Safari zooming the whole page when a pinch starts off the globe
for (const ev of ["gesturestart", "gesturechange"]) document.addEventListener(ev, e => e.preventDefault(), {passive: false});

// ---------- Boot ----------
layout(); requestAnimationFrame(frame);
setFlaps("Pin the City");
const getJSON = file => fetch(file).then(r => { if (!r.ok) throw new Error(`${file}: ${r.status}`); return r.json(); });
Promise.all([getJSON("countries-110m.json"), getJSON("cities.json")])
  .then(([topo, cities]) => {
    TIERS = cities.tiers;
    addMap("lo", topo);
    getJSON("countries-hi.json").then(t => addMap("hi", t)).catch(() => {}); // sharper outlines, loaded in the background
    setTimeout(start, reduced ? 0 : 900); // let the title settle on the board first
  })
  .catch(() => {
    $("tier").textContent = "The map or city list didn't load";
    $("hint").textContent = "Keep countries-110m.json and cities.json next to this page and open it through a local server, not by double-clicking.";
  });
</script>
